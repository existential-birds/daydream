name: Training dry path

# GPU-free validation of the training pipeline (M20, M24): the coordinator's
# dry run over the committed 50-record frozen-projection fixture, plus the
# standalone RL checks and the root suite. No pynvml, no CUDA — every step is
# CPU-only.

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  training-dry:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify uv.lock is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run RL checks
        run: make rl-check

      - name: Run root test suite
        # Coverage flags live here in CI (see .github/workflows/ci.yml); plain
        # pytest so the targeted training tests never trip the coverage floor.
        run: uv run pytest -n auto -q
