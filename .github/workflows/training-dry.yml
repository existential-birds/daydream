name: Training dry path

# GPU-free validation of the training pipeline (M20, M24): the coordinator's
# dry run over the committed 50-record fixture, plus the standalone RL checks
# and the root suite. No pynvml, no CUDA — every step is CPU-only.

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  training-dry:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify uv.lock is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Training coordinator dry run over the 50-record fixture
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import tempfile

          from daydream.training.coordinator import PipelineConfig, run_pipeline

          fixture = Path("tests/fixtures/training/records-50/records.jsonl")
          with tempfile.TemporaryDirectory() as out:
              manifest = run_pipeline(
                  PipelineConfig(corpus=fixture, out_dir=Path(out)), dry_run=True
              )
              assert manifest["stages"]["stage0"]["status"] == "complete"
              assert manifest["stages"]["stage0"]["gate"]["passed"] is True
              for stage in ("stage1", "stage2"):
                  assert manifest["stages"][stage]["status"] == "skipped_dry"
              adapter = Path(manifest["adapter_path"])
              assert (adapter / "adapter_config.json").is_file()
              assert (adapter / "adapter_state.json").is_file()
              assert json.loads((Path(out) / "manifest.json").read_text())["dry_run"] is True
          print("training dry path OK")
          PY

      - name: Run RL checks
        run: make rl-check

      - name: Run root test suite
        # Coverage flags live here in CI (see .github/workflows/ci.yml); plain
        # pytest so the targeted training tests never trip the coverage floor.
        run: uv run pytest -n auto -q
