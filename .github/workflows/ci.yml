name: CI

permissions:
  contents: read
  actions: read
  pull-requests: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      test_jobs:
        description: Root pytest jobs (1 is the eight-worker benchmark baseline)
        type: choice
        options: ["4", "2", "1"]
        default: "4"
      run_rl:
        description: Run the dormant standalone RL gate as well as the root gate
        type: boolean
        default: false

# Only superseded PR runs are cancelled. Push runs have a unique group so
# every main/master commit keeps its own verification run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      full: ${{ steps.plan.outputs.full }}
      count: ${{ steps.shards.outputs.count }}
      matrix: ${{ steps.shards.outputs.matrix }}
      workers: ${{ steps.shards.outputs.workers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan CI gate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_plan.py plan
      - name: Plan pytest shards
        id: shards
        env:
          TEST_JOBS: ${{ inputs.test_jobs || '4' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          count = int(os.environ["TEST_JOBS"])
          if count not in (1, 2, 4):
              raise ValueError("Unsupported pytest job count")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"count={count}\nworkers={8 if count == 1 else 4}\n")
              output.write(f"matrix={json.dumps({'index': list(range(count))})}\n")
          PY

  static-checks:
    needs: plan
    if: needs.plan.outputs.count != '1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        if: needs.plan.outputs.mode != 'reuse'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Verify uv.lock is in sync
        if: needs.plan.outputs.mode != 'reuse'
        run: make lockcheck
      - name: Install dependencies
        if: needs.plan.outputs.mode != 'reuse'
        run: make install
      - name: Lint with ruff
        if: needs.plan.outputs.mode != 'reuse'
        run: make lint
      - name: Run vulture
        if: needs.plan.outputs.full == 'true'
        # Root only; the standalone RL scan remains in its manual job.
        run: uv run vulture --config pyproject.toml daydream tests
      - name: Type check with mypy
        if: needs.plan.outputs.full == 'true'
        run: make typecheck
      - name: Run script unit tests
        if: needs.plan.outputs.full == 'true'
        run: make test-scripts
      - name: Naming grep-gate
        run: make check-naming
      - name: Lint workflows with actionlint
        env:
          ACTIONLINT_REQUIRE_DOCKER: "1"
        run: make actionlint

  test-shard:
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.count != '1'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Node for native Pi contract tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Install Pi for native output contract tests
        run: |
          npm install --global @earendil-works/pi-coding-agent@1.0.4
          node --version
          pi --version
      - name: Verify uv.lock is in sync
        run: make lockcheck
      - name: Install dependencies
        run: make install
      - name: Run pytest shard
        env:
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_COUNT: ${{ needs.plan.outputs.count }}
          PYTEST_WORKERS: ${{ needs.plan.outputs.workers }}
        run: >-
          uv run python scripts/ci_shard.py run
          --index "$SHARD_INDEX" --count "$SHARD_COUNT" --workers "$PYTEST_WORKERS"
          --output "shard-$SHARD_INDEX"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.index }}
          overwrite: true
          path: shard-${{ matrix.index }}/
          if-no-files-found: error

  coverage:
    needs: [plan, test-shard]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.full == 'true' && needs.plan.outputs.count != '1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Verify uv.lock is in sync
        run: make lockcheck
      - name: Install dependencies
        run: make install
      - name: Download all shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: shard-evidence
      - name: Combine and enforce branch coverage
        env:
          SHARD_COUNT: ${{ needs.plan.outputs.count }}
        run: uv run python scripts/ci_shard.py combine --diagnostic --count "$SHARD_COUNT" --input shard-evidence
      - name: Check coverage report
        run: make coverage-report
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          overwrite: true
          path: coverage.xml
          if-no-files-found: error

  legacy-check:
    needs: plan
    # Literal pre-sharding single-job baseline, only for controlled dispatches.
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.count == '1'
    runs-on: ubuntu-24.04
    # Keep the measured worker count independent of runner CPU availability.
    env:
      PYTEST_WORKERS: "8"
      PYTEST_REPORT_ARGS: "--junitxml=baseline-tests.xml"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Node for native Pi contract tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false

      - name: Install Pi for native output contract tests
        run: |
          npm install --global @earendil-works/pi-coding-agent@1.0.4
          node --version
          pi --version

      # After runtime provisioning, every check below is a gate step in the Makefile: the ordered
      # check set lives there once (see `make check`). This job adds only the
      # setup steps, the root-only vulture scan, and the coverage artifact
      # upload, so a gate change is a one-file edit.

      # Reads the freshly checked-out committed uv.lock BEFORE `uv sync` can heal
      # it. Fails if a release bumped pyproject.toml but forgot `uv lock`, so a
      # stale lock (which breaks `uv sync --locked` for reproducible installs)
      # can never merge.
      - name: Verify uv.lock is in sync
        run: make lockcheck

      - name: Install dependencies
        # The benchmark extra (harbor) is required by the benchmark objective/
        # aggregate tests in the default suite; the `install` step syncs all
        # extras so the full suite runs with every dependency it exercises.
        run: make install

      - name: Lint with ruff
        run: make lint

      - name: Run vulture
        # Root project only: the standalone RL scan is the manual rl-check
        # job's business, so this deliberately does not call `make deadcode`
        # (whose scan also covers rl/daydream_review, the richer local gate).
        run: uv run vulture --config pyproject.toml daydream tests

      - name: Type check with mypy
        run: make typecheck

      - name: Naming grep-gate
        run: make check-naming

      - name: Lint workflows with actionlint
        # Required here: the step skips with a note when no Docker daemon is
        # available, and a silent skip would turn a workflow-lint failure into
        # a green run.
        env:
          ACTIONLINT_REQUIRE_DOCKER: "1"
        run: make actionlint

      - name: Run tests
        # The coverage flags live in the `test` step (not in pyproject addopts),
        # so targeted runs like `pytest tests/foo.py` stay plain and never trip
        # the enforced floor even when all their tests pass (#336).
        run: make test

      - name: Upload coverage report
        # Machine-readable XML from pytest-cov (--cov-report=xml on the Run tests
        # step above, #932). Uploaded on every check run so coverage results are
        # inspectable after any full run, not just green ones.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ea165f8d65b6e75b540449e92b4886f43607fa02 v7.0.2
        with:
          name: coverage-report
          overwrite: true
          path: |
            coverage.xml
            baseline-tests.xml
          if-no-files-found: error


  check:
    needs: [plan, static-checks, test-shard, coverage, legacy-check]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require complete CI gate
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.count == '1' && 'baseline' || needs.plan.outputs.mode }}
          BASELINE_RESULT: ${{ needs.legacy-check.result }}
          STATIC_RESULT: ${{ needs.static-checks.result }}
          SHARD_RESULT: ${{ needs.test-shard.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$PLAN_RESULT" = success
          python3 scripts/ci_shard.py gate --mode "$MODE" --static-result "$STATIC_RESULT" --shard-result "$SHARD_RESULT" --coverage-result "$COVERAGE_RESULT" --baseline-result "$BASELINE_RESULT"
      # Implicit success() prevents publication after any failed dependency.
      - name: Record successful merge-group tree
        if: github.event_name == 'merge_group' && needs.plan.outputs.full == 'true'
        run: python3 scripts/ci_plan.py record --proof-dir "${{ runner.temp }}/ci-proof"
      - name: Upload successful merge-group tree
        if: github.event_name == 'merge_group' && needs.plan.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-proof
          overwrite: true
          path: ${{ runner.temp }}/ci-proof/proof.json
          retention-days: 14
          if-no-files-found: error

  rl-check:
    # RL development is paused. Retain the complete gate for explicit runs.
    if: github.event_name == 'workflow_dispatch' && inputs.run_rl

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: rl/daydream_review

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: rl/daydream_review/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The standalone suite's negative-gate tests git-commit into throwaway
      # temp repos (e.g. the empty-commit fix-tracking cases). Runners carry no
      # global identity, so without this the commits fail with "Author identity
      # unknown". A fixed, neutral identity keeps those tests deterministic and
      # identical on every runner.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@daydream.invalid"
          git config --global user.name "daydream CI"

      # Reads the freshly checked-out committed standalone uv.lock BEFORE `uv sync`
      # can heal it. A stale standalone lock (a change bumped the standalone
      # pyproject.toml but forgot `uv lock`) must fail here, not be silently healed.
      - name: Verify standalone uv.lock is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy daydream_review tests

      - name: Run vulture
        run: uv run vulture --config pyproject.toml daydream_review tests

      # The full documented standalone gate (rl/daydream_review/README.md:17-21),
      # including the two `slow` Docker-baseline image tests. The runner's daemon
      # must be usable so they PASS rather than skip (Task 0 spike); the check
      # job's required Docker-backed `make actionlint` step proves this runner
      # runs containers. No selection flags: the full suite is the gate.
      - name: Run tests
        run: uv run pytest
