# Dependabot dependency updates (issue #936).
#
# Three bounded ecosystems, each opening at most 5 pull requests at a time:
#   - uv @ "/"                  — root workspace dependencies (pyproject.toml / uv.lock)
#   - uv @ "/rl/daydream_review_v1" — the standalone RL package's own dependencies
#   - npm @ "/.github/workflows" — the tracking package.json in the workflows folder
#     (that is where the manifest lives — do not "fix" this directory to "/");
#     it tracks the single @openai/codex dependency used by CI.
#
# All four run weekly on Mondays (Australia/Brisbane) with grouped minor+patch
# updates on the three multi-dependency ecosystems, so dependency updates arrive
# as small, predictable, reviewer-friendly PRs.
#
# Reviewers come from the single-rule CODEOWNERS (`* @existential-birds @anderskev`).
# Every Dependabot PR must pass `make check` before merge — the lockcheck-first
# ordering there is what catches uv.lock / pyproject.toml drift.
version: 2
updates:
  # Root workspace uv dependencies.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
    # tree-sitter 0.26.0 is blocked in-repo: native Point-getter use-after-free
    # that SIGSEGVs the process (py-tree-sitter#472). The fix (py-tree-sitter#466)
    # is merged upstream but unreleased, and daydream/_tree_sitter_safety.py
    # refuses 0.26.0. Hold the pin at 0.25.2 until a fixed version ships.
    ignore:
      - dependency-name: tree-sitter

  # Standalone RL package uv dependencies.
  - package-ecosystem: uv
    directory: /rl/daydream_review_v1
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  # Third-party GitHub Actions. Re-enabled after the hand-maintained SHA→version
  # map in tests/test_workflow_templates.py was deleted: that map, not the SHA
  # pinning itself, is what made every actions bump structurally unmergeable —
  # Dependabot rewrote the pin and its `# vX.Y.Z` comment but could not edit a
  # dict in a test file. Pins stay full 40-hex commit SHAs, still enforced by
  # test_bot_workflow_action_references_are_pinned_to_commit_shas.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  # npm tracks the workflows-folder package.json (the @openai/codex pin).
  # The directory is the workflows folder on purpose — see header comment.
  - package-ecosystem: npm
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
