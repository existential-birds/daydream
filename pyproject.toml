[project]
name = "daydream"
version = "0.28.0"
description = "Automated code review and fix loop using Claude"
requires-python = ">=3.12.13"
dependencies = [
    "claude-agent-sdk==0.2.116",
    "anyio>=4.0",
    "rich>=15.0.0",
    "pyfiglet>=1.0",
    "pydantic>=2.11.7",
    "httpx>=0.28",
    "PyJWT>=2.0",
    "jsonschema>=4.0",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
benchmark = ["harbor>=0.22,<0.23"]
hub = ["huggingface_hub>=0.26"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.5",
    "types-jsonschema>=4.26",  # tracked to jsonschema 4.26.x
    "types-pyyaml>=6.0",
    "pytest-cov==7.1.0",  # exact pin: fail_under comparisons depend on reproducible coverage tool behavior (#932)
    "vulture>=2.13",
]

[project.scripts]
daydream = "daydream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicitly declare the source package and all non-Python package data so the
# distribution contract does not rely on hatchling's default discovery heuristics.
# daydream_ext is the fork extension package (docs/extensions.md); absent upstream by design.
packages = ["daydream", "daydream_ext"]
include = [
    "daydream/templates/**",
    "daydream/training/schema/**",
    "daydream/atif/LICENSE",
    "daydream/atif/NOTICE",
    "daydream/benchmark/harbor/templates/**",
    "daydream/benchmark/harbor/runtime-requirements.lock",
]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
# The sandbox score_review.py does a bare `import verifier_core` (the twin of
# in-repo daydream.benchmark.harbor.verifier_core, copied beside it at sandbox
# build time; golden byte-parity gate: tests/test_benchmark_verifier_assets.py).
# That top-level name is not on sys.path, so mypy_stubs/verifier_core.py shims it
# by re-exporting the source twin's public API. Pointing mypy_path at harbour/
# itself would discover the twin twice ("Source file found twice"), so the shim
# lives on its own mypy_path root -- the sandbox still checks against the real
# signatures, never Any.
mypy_path = "mypy_stubs"


[[tool.mypy.overrides]]
# Vendored from harbor-framework/harbor@v0.17.1-9 (see daydream/atif/NOTICE);
# mechanical-edit-only policy forbids hand-fixes. Mirrors ruff exemption above.
module = ["daydream.atif.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Harbor ships without py.typed; no stub package exists. Narrow per-module,
# not blanket-library, so future typed releases are picked up automatically.
module = ["harbor.models.*", "harbor.agents.base", "harbor.environments.docker.*", "harbor.environments.base"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No types-huggingface_hub exists on PyPI (verified); boundary stays Any-typed.
module = ["huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Sample-repo/symbol fixture modules are literal demo data (a sample project the
# CLI treks, symbol tables a matcher parses), not test logic. Strict annotations
# would rewrite the sample itself, so they are exempted from the untyped-def
# wave (disallow_untyped_defs=false). Other fixtures/training helpers stay
# checked. Lift when these fixtures carry real signatures. Ref: issue-931 task 4.
module = [
    "tests.fixtures.real_cli_sample_repo.hello",
    "tests.fixtures.symbols.config",
    "tests.fixtures.symbols.widget",
]
disallow_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Vendored from Harbor v0.17.1-9; see daydream/atif/NOTICE.
# Mechanical-only edit policy (D-03): no reformatting allowed.
"daydream/atif/**" = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
# Bare `pytest` must not descend into rl/daydream_review_v1/, a standalone uv
# project with its own verifiers-based suite and its own lockfile.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# No coverage flags in addopts: global --cov/--fail-under would gate every targeted subset run (`pytest tests/foo.py`) on the 87% floor even when all its tests pass (#336). The coverage flags live on the full-suite gated invocations (make test / CI check step) so a bare or targeted pytest stays plain; no --no-cov-on-fail so coverage.xml survives failed full-suite runs for the CI upload.
addopts = "--strict-markers"
markers = [
    "live_codex: requires the real `codex` CLI on $PATH with valid auth; skipped automatically when codex is absent. Used by the real-CLI live smoke test in tests/test_codex_real_cli_contract.py.",
    "live_gh: requires the installed gh with working auth; env-gated (DAYDREAM_LIVE_GH=1) so CI never needs network credentials. Used by the opt-in live preflight smoke test in tests/test_benchmark_gh_smoke.py.",
]

# Whole-project dead-code detection (#935). Scans pkg+tests together so test
# references count; min_confidence and exclude mirror the baseline that this
# gate enforces as clean at merge time.
[tool.vulture]
min_confidence = 80
exclude = ["*/atif/*"]
# Fixture/lambda params referenced only by name are suppressed per-line with
# `# noqa` at their exact definition site, never tree-wide via `ignore_names`
# (a flat name list would mask any future genuinely-dead symbol that happened
# to share a generic name across daydream and tests).

# Enforced branch-coverage gate (#932). Measured over the first-party
# daydream package only; run `make coverage-report` and docs/coverage.md
# for the measurement + ratchet procedure. fail_under is the measured
# full-suite baseline, rounded down to a whole percent — raise it only
# via the documented ratchet, never lower it.
[tool.coverage.run]
branch = true
source = ["daydream"]
omit = [
    # Vendored from harbor-framework/harbor@v0.17.1-9 (see daydream/atif/NOTICE);
    # mechanical-edit-only policy (D-03) forbids touching it to add tests, so
    # including it would set the floor from code no one may edit.
    # Mirrors the mypy and ruff exemptions above.
    "daydream/atif/*",
]

[tool.coverage.report]
# measured 86.94% at 411a50d on 2026-08-28; ratchet via docs/coverage.md
fail_under = 86

[tool.coverage.xml]
output = "coverage.xml"
