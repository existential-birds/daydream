[project]
name = "daydream"
version = "0.34.0"
description = "Automated code review and fix loop using Claude"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk==0.2.174",
    "anyio>=4.15.1",
    "rich>=15.0.0",
    "pyfiglet>=1.0",
    "pydantic>=2.14.2",
    "httpx>=0.28",
    "PyJWT>=2.15.0",
    "jsonschema>=4.0",
    # Held at 0.25.2: 0.26.0 has a native Point-getter use-after-free that
    # SIGSEGVs the process (py-tree-sitter#472). daydream/_tree_sitter_safety.py
    # blocks 0.26.0 outright; the fix (py-tree-sitter#466) is merged upstream but
    # not yet released. Loosen this pin once a fixed version ships on PyPI.
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "pyyaml>=6.0",
    "traceloop-sdk==0.62.4",
    "opentelemetry-api>=1.45.2,<2",
    "opentelemetry-sdk>=1.42,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42,<2",
    "opentelemetry-semantic-conventions-ai==0.5.1",
    "requests>=2.32,<3",
    "psutil>=7,<8",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=2.4.0"]

[dependency-groups]
dev = [
    "grpcio>=1.85.0",
    "grpc-stubs>=1.53",
    "opentelemetry-proto>=1.42,<2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-xdist>=3.6",
    "ruff>=0.17.3",
    "types-jsonschema>=4.26.0.20261006",  # tracked to jsonschema 4.26.x
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "types-protobuf>=7.35.1.20260906",
    "pytest-cov==7.1.0",  # exact pin: fail_under comparisons depend on reproducible coverage tool behavior (#932)
    "vulture>=2.13",
    "types-psutil>=7,<8",
    "actionlint-py==1.7.7.23",
]

[project.scripts]
daydream = "daydream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicitly declare the source package and all non-Python package data so the
# distribution contract does not rely on hatchling's default discovery heuristics.
# daydream_ext is the fork extension package (docs/extensions.md); absent upstream by design.
packages = ["daydream", "daydream_ext"]
include = [
    "daydream/templates/**",
    "daydream/backends/pi_structured_output.ts",
    "daydream/backends/pi_host_tools.ts",
    "daydream/backends/pi_diagnostics.ts",
    "daydream/training/schema/**",
    "daydream/atif/LICENSE",
    "daydream/atif/NOTICE",
]

[tool.mypy]
python_version = "3.14"
strict = true
namespace_packages = true
explicit_package_bases = true


[[tool.mypy.overrides]]
# Vendored from harbor-framework/harbor@v0.17.1-9 (see daydream/atif/NOTICE);
# mechanical-edit-only policy forbids hand-fixes. Mirrors ruff exemption above.
module = ["daydream.atif.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# No types-huggingface_hub exists on PyPI (verified); boundary stays Any-typed.
module = ["huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Sample-repo/symbol fixture modules are literal demo data (a sample project the
# CLI treks, symbol tables a matcher parses), not test logic. Strict annotations
# would rewrite the sample itself, so they are exempted from the untyped-def
# wave (disallow_untyped_defs=false). Other fixtures/training helpers stay
# checked. Lift when these fixtures carry real signatures. Ref: issue-931 task 4.
module = [
    "tests.fixtures.real_cli_sample_repo.hello",
    "tests.fixtures.symbols.config",
    "tests.fixtures.symbols.widget",
]
disallow_untyped_defs = false

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
# Merge same-module imports, including aliased re-exports, into one statement.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Vendored from Harbor v0.17.1-9; see daydream/atif/NOTICE.
# Mechanical-only edit policy (D-03): no reformatting allowed.
"daydream/atif/**" = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# No coverage flags in addopts: global --cov/--fail-under would gate every targeted subset run (`pytest tests/foo.py`) on the floor enforced by [tool.coverage.report] fail_under even when all its tests pass (#336). The coverage flags live on the full-suite gated invocations (make test / CI check step) so a bare or targeted pytest stays plain; no --no-cov-on-fail so coverage.xml survives failed full-suite runs for the CI upload.
# Limit dispatch batches so expensive groups can share the workers.
# Worker count and coverage remain owned by the full-suite invocation.
addopts = "--strict-markers --maxschedchunk=10 --durations=40"

# Whole-project dead-code detection (#935). Scans pkg+tests together so test
# references count; min_confidence and exclude mirror the baseline that this
# gate enforces as clean at merge time.
[tool.vulture]
min_confidence = 80
exclude = ["*/atif/*"]
# Fixture/lambda params referenced only by name are suppressed per-line with
# `# noqa` at their exact definition site, never tree-wide via `ignore_names`
# (a flat name list would mask any future genuinely-dead symbol that happened
# to share a generic name across daydream and tests).

# Enforced branch-coverage gate (#932). Measured over the first-party
# daydream package only; run `make coverage-report` and docs/coverage.md
# for the measurement + ratchet procedure. fail_under is the measured
# full-suite baseline, rounded down to a whole percent — raise it only
# via the documented ratchet, never lower it.
[tool.coverage.run]
branch = true
relative_files = true
source = ["daydream"]
omit = [
    # Vendored from harbor-framework/harbor@v0.17.1-9 (see daydream/atif/NOTICE);
    # mechanical-edit-only policy (D-03) forbids touching it to add tests, so
    # including it would set the floor from code no one may edit.
    # Mirrors the mypy and ruff exemptions above.
    "daydream/atif/*",
]

[tool.coverage.report]
# measured 90.59% at 060e463f on 2026-10-12; ratchet via docs/coverage.md
fail_under = 90

[tool.coverage.xml]
output = "coverage.xml"
