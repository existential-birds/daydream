[project]
name = "daydream-review-v1"
version = "0.2.0"
description = "verifiers v1 environment: the daydream deep review-fix-test loop as a Harness with sandboxed fix verification, scored only on sealed artifacts with the suite result demoted to non-regression telemetry"
# Lower bound is daydream's own floor (root pyproject requires-python = ">=3.12.13");
# upper bound is verifiers 0.2.1's (">=3.11,<3.14").
requires-python = ">=3.12.13,<3.14"
dependencies = [
    "verifiers==0.2.1",
    "daydream",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

# daydream is consumed as a path dependency so the rewards import the SAME
# score_trajectory the training pipeline uses. verifiers' ~100-package tree
# must never reach daydream's own lockfile, hence the standalone project.
[tool.uv.sources]
daydream = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daydream_review_v1"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "slow: builds real container images; skipped automatically when docker is not installed or the daemon is unavailable.",
]
