# Stage-2 deterministic RFT replay. Daydream-private reference parameters —
# passed at launch via RftConfig to daydream.training.rft.run_rft(), not
# loaded from this file (reference-only, matching the README invocation) —
# NOT a prime-rl config: RFT is an offline, GPU-free deterministic replay of
# the frozen corpus, not an online RL run (the online RL shape lives in
# rl.toml; the dataset-SFT shape in sft.toml).
#
# The winners filter is always a breakdown-shaped spec supplied to RftConfig
# (per-axis minimums, e.g. {"composite": 0.6, "correctness_per_finding": 0.5}) — never a
# bare scalar (M12).
# Supported axes: composite, correctness_per_finding (mean), length_penalty.
# All thresholds are minimums; length_penalty is not a verbosity ceiling.
# Intrinsic reward: clip(correctness - 0.2 * clip((length - 2000) / 8000, 0, 1),
# 0, 1), rounded to four places. Invalid format floors it; absent correctness
# leaves it uncomputable. Grounding and posterior cost do not enter this score.

# Deterministic replay: temperature 0 and an explicit seed. Byte-identical
# reruns are the acceptance contract (M11) — do not raise temperature here.
[sampling]
temperature = 0.0
seed = 11
candidates_per_task = 4

[model]
# Provenance stamp written into the winners header; the real model id is
# passed at launch (--model-id) per SPEC C1.
id = "Qwen/Qwen3-0.6B"
