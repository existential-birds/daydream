# Per-repo container image inputs for the daydream-review environment.
#
# One entry per repository slug, keyed `owner/name`. The manifest is the single
# source of truth for the rollout set: every PR snapshot a taskset loads is
# declared here, and a repo or PR absent from the manifest is not a task.
#
# `image` is a docker repository name WITHOUT a tag. The tag is the task's
# 12-char head SHA, so one image == one PR snapshot: `daydream-rl/fixture:dd5245c87c33`.
# That is what makes the green-baseline gate meaningful — the suite is proven
# green at the exact commit the rollout reviews.
#
# `clone_url` is what `images/repo.Dockerfile` mirror-clones. The sentinel
# `fixture://daydream-rl-fixture` tells `build_images.py` to materialize the
# deterministic fixture repository from `daydream_review.fixture` instead of cloning.
#
# `protected_test_paths` is the test oracle inventory: LITERAL repository-relative
# files/directories that constitute the repo's test oracle. It is required and
# nonempty (a missing or empty list is a manifest-load error), and every entry must
# be a literal path — no git pathspec syntax (``*``/``?``/``[`` globs, a leading
# ``:`` magic), which the manifest loader rejects: at scoring time
# `suite_non_regression` compares these paths against the baked head SHA, fail-closed:
# any tracked difference (committed, staged, unstaged, deleted, renamed), any
# non-ignored untracked file under a protected path, or any Git error means the
# oracle changed and the rollout records `suite_non_regression` 0.0 without running
# `test_command`. Cover every runner-config filename `test_command` can load,
# including absent ones whose later creation could alter collection.
#
# `prs` declares the PR snapshots the entry ships as tasks — at least one per
# entry. Each snapshot pins `pr_number`, `base_sha` and `head_sha` (the SHAs the
# image build and the scoring baseline use) and optionally `base_ref` plus
# `golden_comments` (upstream review comments; telemetry only — never a reward).

[repos."existential-birds/daydream-rl-fixture"]
clone_url = "fixture://daydream-rl-fixture"
image = "daydream-rl/fixture"
test_command = "python -m unittest discover -q"
setup_cmds = []
protected_test_paths = ["tests"]

[[repos."existential-birds/daydream-rl-fixture".prs]]
pr_number = 1
base_ref = "main"
base_sha = "97a1057003fbeb9375d36d15459e025b2dab1da0"
head_sha = "8780a53f6995c560e2a502507bb295844d7d396f"
golden_comments = [
    { comment = "`divide` raises ZeroDivisionError when `b` is 0. Guard the divisor or document the contract.", path = "calc.py", line = 10, resolved = true },
]

[[repos."existential-birds/daydream-rl-fixture".prs]]
pr_number = 2
base_ref = "main"
base_sha = "8780a53f6995c560e2a502507bb295844d7d396f"
head_sha = "dd5245c87c336bcdbc6401aa78b387ffbc474d41"
golden_comments = [
    { comment = "`mean([])` raises ZeroDivisionError. Return 0.0 or raise a typed error instead.", path = "calc.py", line = 16, resolved = false },
]

# Reference entry: real upstream history, proving the tooling on something other
# than a synthetic repo. BSD-3-Clause, not on the C5 exclusion list, and its whole
# suite runs in seconds. Its single PR snapshot is declared below (PR #406, head
# 4bb03cd6819228f3, base 4dffa1963f896a0a — the merge commit's two parents).
#
# Dependencies install strictly from the repository's committed uv.lock via a
# locked sync into an environment OUTSIDE /work/repo (/opt/repo-venv), and the
# test command runs that environment's interpreter. A lock that is missing or
# stale fails the build (set -eu in setup.sh); there is no pip fallback.
#
# This is a reference, NOT the training set. Expanding to a real training-repo set
# is data ops, tracked as its own numbered task on issue #164.
[repos."pallets/itsdangerous"]
clone_url = "https://github.com/pallets/itsdangerous.git"
image = "daydream-rl/itsdangerous"
test_command = "/opt/repo-venv/bin/python -m pytest -q"
setup_cmds = ["UV_PYTHON_DOWNLOADS=never UV_PROJECT_ENVIRONMENT=/opt/repo-venv uv sync --locked --no-default-groups --group tests"]
protected_test_paths = ["tests", "conftest.py", ".pytest.ini", "pytest.ini", "pyproject.toml", "setup.cfg", "tox.ini"]

[[repos."pallets/itsdangerous".prs]]
pr_number = 406
base_ref = "main"
base_sha = "4dffa1963f896a0a311dec3c14f003a5f382c446"
head_sha = "4bb03cd6819228f30079885297299fe568a62863"
