[project]
name = "daydream-review"
version = "0.2.0"
description = "verifiers v1 environment: the daydream deep review-fix-test loop as a Harness with sandboxed fix verification, scored only on sealed artifacts with the suite result demoted to non-regression telemetry"
requires-python = ">=3.14,<3.15"
dependencies = [
    # 0.4.0 is the first stable release supporting Python 3.14; retain its v1 API.
    "verifiers==0.4.0",
    "daydream",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "vulture>=2.13",
]

# daydream is consumed as a path dependency so the rewards import the SAME
# score_trajectory the training pipeline uses. verifiers' ~100-package tree
# must never reach daydream's own lockfile, hence the standalone project.
[tool.uv.sources]
daydream = { path = "../..", editable = true }

[tool.uv]
# verifiers 0.4.0, the latest release, pins mcp==2.0.0, which carries open
# security advisories. Drop this override once verifiers allows mcp>=2.2.0.
override-dependencies = ["mcp>=2.2.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daydream_review"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
# Merge same-module imports, including aliased re-exports, into one statement.
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
namespace_packages = true
mypy_path = "../..:tests"
strict = true
# daydream is a sibling first-party package (no py.typed; mypy_path + follow
# make it fully checked). verifiers is the only untyped seam: its pinned 0.4.0
# wheel ships without a py.typed marker or .pyi stubs, so
# its import surface and strict-subclass / strict-decorator expectations are the
# legitimate typed-against-untyped boundary. mypy applies the subclassing and
# untyped-decorator toggles per checked FILE, not per the base/dependent module,
# so neither can live inside the verifiers-scoped override below; both are
# relaxed globally here and nothing else is: every own def, annotation, return
# and call stays strict, and a future typed verifiers release is picked up
# automatically.
follow_untyped_imports = true
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# The pinned verifiers wheel has no py.typed marker or .pyi stubs; strip
# the import to Any for verifiers modules only, never a blanket-library ignore.
module = ["verifiers.*"]
ignore_missing_imports = true
follow_imports = "skip"
# (Base classes Task/Harness/Taskset/Data/Config/State/Trace/Runtime are the Any
# boundary the two toggles above describe; nothing else is relaxed here.)

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "slow: builds real container images; skipped automatically when docker is not installed or the daemon is unavailable.",
]

# Whole-project dead-code detection (#935). Scans pkg+tests together so test
# references count; min_confidence mirrors the baseline that this gate enforces.
[tool.vulture]
min_confidence = 80
